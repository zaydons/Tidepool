name: Build installers

# - Pull requests and manual runs: build everything and attach the installers
#   to the workflow run (Actions tab → run → Artifacts).
# - Pushing to main with a new "version" in package.json: tags that commit
#   (e.g. v0.2.0) and creates a draft GitHub Release with every installer
#   attached. Review it, then click Publish. Pushes to main that don't change
#   the version build nothing.
# - Pushing a tag like v0.2.0 by hand also creates a draft release.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  # Never cancel a release build halfway; only superseded PR builds.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write # needed to push the tag and create the release

jobs:
  version:
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      # Decides which release (if any) this run produces:
      # - tag push: that tag
      # - push to main: v<package.json version>, if that tag doesn't exist yet
      # - anything else: none (build only)
      - name: Tag new version
        id: tag
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_EVENT_NAME" = "push" ]; then
            tag="v$(node -p "require('./package.json').version")"
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
              echo "$tag already exists; nothing to release."
            else
              git tag "$tag"
              git push origin "$tag"
              echo "Tagged $GITHUB_SHA as $tag."
              echo "tag=$tag" >> "$GITHUB_OUTPUT"
            fi
          fi

  build:
    name: ${{ matrix.name }}
    needs: version
    # Pushes to main only build when they produce a release.
    if: github.event_name != 'push' || needs.version.outputs.tag != ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon + Intel)
            runner: macos-latest
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin
          # Ubuntu 22.04 is deliberately old: binaries built against its glibc
          # run on 22.04 and newer distros (Mint 21+, Debian 12+, Fedora 36+...).
          - name: Linux x86_64
            runner: ubuntu-22.04
            rust-targets: ""
            args: ""
          - name: Linux ARM64
            runner: ubuntu-22.04-arm
            rust-targets: ""
            args: ""
    runs-on: ${{ matrix.runner }}
    env:
      RELEASE_TAG: ${{ needs.version.outputs.tag }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.runner }}

      - name: Install npm dependencies
        run: npm ci

      # Auto-update files (signed bundles + latest.json) need the signing key.
      # Releases must have it; other runs build without update files if the
      # secret isn't available (e.g. pull requests from forks).
      - name: Check updater signing key
        id: updater
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -n "$KEY" ]; then
            echo "args=--config src-tauri/tauri.release.conf.json" >> "$GITHUB_OUTPUT"
          elif [ -n "$RELEASE_TAG" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY secret is missing; a release without it can't auto-update."
            exit 1
          else
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY not set; building without auto-update files."
          fi

      - name: Build installers
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: ${{ matrix.args }} ${{ steps.updater.outputs.args }}
          # Only release runs create a (draft) release; other runs just build.
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: Tidepool ${{ env.RELEASE_TAG }}
          releaseBody: See the README for install instructions.
          releaseDraft: true
          uploadWorkflowArtifacts: true
