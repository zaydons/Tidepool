[package]
name = "tidepool"
version = "0.1.0"
description = "Cross-platform MQTT explorer"
authors = ["Sal Zaydon"]
edition = "2024"
license = "MIT"
repository = "https://github.com/zaydons/Tidepool"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tidepool_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rumqttc = { version = "0.25", default-features = false, features = ["use-rustls-no-provider"] }
# One explicit TLS crypto backend (ring), shared by the MQTT client and the updater.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio = { version = "1", features = ["time", "sync", "macros"] }
base64 = "0.22"
# Without the "zip" feature: zip is only used for Windows updates, which Tidepool doesn't ship.
tauri-plugin-updater = { version = "2", default-features = false, features = ["rustls-tls", "system-proxy"] }
tauri-plugin-process = "2"
tauri-plugin-opener = "2"
keyring = "4"
tauri-plugin-dialog = "2"
rustls-native-certs = "0.8"
rustls-pki-types = { version = "1", features = ["std"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros", "net", "io-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
